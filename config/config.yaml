# Babel sqlite files, named babel-YYYYMMDD.sqlite. The build uses the release
# the graph was built with (translator:babelVersion in its graph-metadata.json)
# and stops if that file is not here. Biolink likewise follows the graph.
babel_dir: /home/hodgesf/Desktop/code/large_files
pubmed_dir: /home/hodgesf/Desktop/code/large_files/pubmed

# Tier0 graph, placed by hand as {graph_root}/YYYYMMDD/{nodes.jsonl,edges.jsonl,graph-metadata.json}
# where YYYYMMDD is the graph's build date. The newest one is built unless
# graph_version pins another.
graph_root: /home/hodgesf/Desktop/code/large_files/translator_kg
# graph_version: "20260928"

# Artifacts are written to {output_root}/YYYYMMDD/.
output_root: /home/hodgesf/Desktop/code/database

# DrugBank is pulled from the webhost when it has a newer version than what is
# local, or when nothing is local. Access is over SSH (key-based, no password).
webhost: ubuntu@kg2webhost.rtx.ai
webhost_drugbank: /home/ubuntu/drugbank.xml      # private: DrugBank is not redistributable
drugbank_dir: /home/hodgesf/Desktop/code/large_files/drugbank
# drugbank_version: "2023-01-04"

# ARAX config_dbs.json: the build writes an updated copy of this file to
# {output_root}/YYYYMMDD/config_dbs.json, pointing the artifacts this pipeline
# builds at arax_db_root/tier0-YYYYMMDD/. The RTX checkout is not modified.
rtx_config_dbs: /home/hodgesf/Desktop/code/RTX/code/config_dbs.json
arax_db_root: /translator/data/orangeboard/databases

# Stage the tested artifacts in {root}/tier0-YYYYMMDD/ on each target: the ARAX
# database server that ARAX_database_manager.py downloads from, and the hosts
# that keep their own copies. Files are uploaded into a hidden staging
# directory and renamed into place once their md5s check out. An existing
# release directory is never overwritten and nothing is deleted.
#   enabled:  run this step as part of a normal build
#   upload:   false = dry run (check and report; upload nothing)
#   sudo:     create and rename the release directory with sudo
#   dir_mode: permissions of the release directory
#   read_check: command prefix that runs as the user ARAX reads the files as;
#               the step fails unless that user can read every staged file
staging:
  enabled: false
  upload: false
  targets:
    arax_databases:
      host: rtxconfig@arax-databases.rtx.ai
      root: /home/rtxconfig
      dir_mode: "775"
    cicd:
      host: ubuntu@cicd.rtx.ai
      root: /mnt/data/orangeboard/databases
      sudo: true
      dir_mode: "777"
    arax_ncats:
      host: hodgesf@10.13.5.17        # arax.ncats.io; reachable only from the NCATS network or VPN
      root: /translator/data/orangeboard/databases
      dir_mode: "777"
      # The rtx2 container mounts /translator/data at the same path and runs ARAX as rt.
      read_check: sudo -n docker exec rtx2 sudo -u rt

# Propose the tested config_dbs.json to RTX as a pull request. Each build gets a
# new branch {branch_prefix}tier0-YYYYMMDD made from the head of base; only that
# branch is ever pushed (never forced), and the PR waits for human review. The
# step stops unless every artifact is already staged on the arax_databases
# target with a matching md5, because the PR's CI downloads them from there.
#   enabled: run this step as part of a normal build
#   push:    false = dry run (clone and show the change and the PR; commit and push nothing)
rtx_pr:
  enabled: false
  push: false
  repo: RTXTeam/RTX
  remote: git@github.com:RTXTeam/RTX
  base: master
  branch_prefix: autobuild/
