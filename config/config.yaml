# Settings shared by everyone who runs this pipeline. Your own settings (local
# paths, the graph to build, your ITRB login) go in config/config.local.yaml,
# which is not tracked: copy config/config.local.example.yaml to start. Anything
# set there overrides this file, key by key.

# Babel sqlite files, named babel-YYYYMMDD[-pN].sqlite. The build uses the
# release the graph was built with (translator:babelVersion in its
# graph-metadata.json), at the highest patch the babel_releases GitHub repo has
# released for it. When that patch is not here, it downloads the sqlite
# (~200 GiB) and checks it against the release's MD5.
# Biolink likewise follows the graph.
babel_releases: Translator-CATRAX/stitch-proj

# Tier0 graph releases. The graph is downloaded to {graph_root}/YYYYMMDD/ if it
# isn't there: the latest release, or the one graph_version names.
graph_releases: https://kgx-storage.ci.transltr.io/releases/translator_kg

# DrugBank is pulled from the webhost when it has a newer version than what is
# local, or when nothing is local. Access is over SSH (key-based, no password).
webhost: ubuntu@kg2webhost.rtx.ai
webhost_drugbank: /home/ubuntu/drugbank.xml      # private: DrugBank is not redistributable
drugbank_version: "2023-01-04"

# ARAX config_dbs.json: the build writes an updated copy of rtx_config_dbs to
# {output_root}/YYYYMMDD/config_dbs.json, pointing the artifacts this pipeline
# builds at arax_db_root/tier0-YYYYMMDD/. The RTX checkout is not modified.
arax_db_root: /translator/data/orangeboard/databases

# Where `autobuild --stage` puts the tested artifacts, in {root}/tier0-YYYYMMDD/:
# the ARAX database server that ARAX_database_manager.py downloads from, the
# hosts that keep their own copies, and the ITRB SFTP drop (sftp: true, below).
# Files are uploaded to a hidden directory and moved into place once their md5s
# check out. Existing files are never overwritten and nothing is deleted.
#   sudo:     create and rename the release directory with sudo
#   dir_mode: permissions of the release directory
#   read_check: command prefix that runs as the user ARAX reads the files as;
#               the step fails unless that user can read every staged file
staging:
  targets:
    arax_databases:
      host: rtxconfig@arax-databases.rtx.ai
      root: /home/rtxconfig
      dir_mode: "775"
    cicd:
      host: ubuntu@cicd.rtx.ai
      root: /mnt/data/orangeboard/databases
      sudo: true
      dir_mode: "777"
    arax_ncats:
      # arax.ncats.io (10.13.5.17) is reached through a jump host, so this is an
      # ~/.ssh/config alias that sets the user, key and ProxyCommand.
      host: arax
      root: /translator/data/orangeboard/databases
      dir_mode: "777"
      # The rtx2 container mounts /translator/data at the same path and runs ARAX as rt.
      read_check: sudo -n docker exec rtx2 sudo -u rt
    itrb_sftp:
      # The ITRB SFTP drop (S3 behind it, no shell). ITRB takes releases from
      # here once the build's RTX PR is merged into master. Artifacts go to
      # {databases}/tier0-YYYYMMDD/ and their md5 files, last, to
      # {md5_sums}/tier0-YYYYMMDD/. Checked by size; never overwritten.
      # Set host (your own login) in config.local.yaml.
      sftp: true
      databases: databases
      md5_sums: md5_sums

# `autobuild --pr` proposes the tested config_dbs.json to RTX. Each build gets a
# branch {branch_prefix}tier0-YYYYMMDD from the head of base. An open PR is updated
# by pushing to its branch; otherwise a new PR is opened. Only that branch is ever
# pushed (never forced), and PRs wait for human review. The step stops unless every
# artifact is staged on the arax_databases target with a matching md5, because the
# PR's CI downloads them from there.
rtx_pr:
  repo: RTXTeam/RTX
  remote: git@github.com:RTXTeam/RTX
  base: master
  branch_prefix: autobuild/

# `autobuild --record` commits this build's record (builds/YYYYMMDD/: report,
# counts, logs, test results) and pushes it straight to the autobuild repo's
# branch, once the build was staged and its RTX PR opened. The commit holds nothing
# but the record, and the push is never forced.
build_record:
  remote: origin
  branch: master
